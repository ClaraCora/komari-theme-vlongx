name: Build Komari Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP="komari-theme-tasogare-latency-${VERSION}-komari.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload theme zip
        uses: actions/upload-artifact@v4
        with:
          name: komari-theme-tasogare-latency-${{ steps.meta.outputs.version }}-komari
          path: ${{ steps.meta.outputs.zip }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Tasogare 黄昏 自选延迟 v${VERSION}

          本版本以 v2.1.3 为应用基线，在节点卡片右上角增加在线天数和账单金额，并按节点自动显示延迟任务。

          ### 本次更新
          - 节点卡片右上角显示完整在线天数，例如 在线 10天。
          - 在线状态下方按节点后台账单显示金额、币种和计费周期，例如 \$25/年、€17.99/月、€281.7/半年。
          - 支持免费节点、月付、季付、半年付、年付和自定义天数计费周期。
          - 恢复 v2.1.3 的 TCPing 延迟/丢包双列历史图和点击详情。
          - 每台机器最多显示 3 个自己已分配的延迟任务，TCPing、ICMP、HTTP 等类型可以混合；默认/自选任务仅作为优先排序。
          - 保留跨周期剩余价值、少于 8 天标红、资源进度条、管理员入口和个人仓库更新地址。

          ### 安装
          下载 \`${ZIP}\`，在 Komari 后台主题管理中直接上传 ZIP，不要解压。
          EOF

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION} — Header uptime and billing" \
              --notes-file release-notes.md \
              --latest
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION} — Header uptime and billing" \
              --notes-file release-notes.md \
              --latest
          fi
