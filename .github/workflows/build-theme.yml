name: Build Komari Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run package

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ZIP="komari-theme-tasogare-latency-${VERSION}-komari.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload theme zip
        uses: actions/upload-artifact@v4
        with:
          name: komari-theme-tasogare-latency-${{ steps.meta.outputs.version }}-komari
          path: ${{ steps.meta.outputs.zip }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.meta.outputs.zip }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Tasogare 黄昏 自选延迟 GPU v${VERSION}

          已同步上游 v2.2.3，并保留 ClaraCora 个人版界面与功能。

          ### 本次更新
          - 新增 GPU/iGPU 详情、月流量周期、动态账单与完整在线天数。
          - 合入 TCPing 底部安全间距、窄屏和高 DPI 修复。
          - 保留双列资源进度条、实时/累计上下行流量、剩余天数和剩余价值。
          - 剩余价值按完整剩余天数跨计费周期计算，少于 8 天时标红。
          - 保留管理员入口、隐藏式底部署名和 ClaraCora 仓库更新地址。

          ### 安装
          下载 \`${ZIP}\`，在 Komari 后台主题管理中直接上传 ZIP，不要解压。
          EOF

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION} — Sync upstream and preserve personal layout" \
              --notes-file release-notes.md
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION} — Sync upstream and preserve personal layout" \
              --notes-file release-notes.md
          fi
